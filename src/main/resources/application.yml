server:
  port: 8080

spring:
  application:
    name: gateway-support
  main:
    web-application-type: reactive
  codec:
    max-in-memory-size: 4MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  health:
    defaults:
      enabled: true

# ── Gateway Core Configuration ──────────────────────────────────────────────
gateway:

  # Hosts allowed to send requests to /WebServices/**
  # Use * to allow all (development only)
  allowed-hosts:
    - "*"

  # Route resolver: yaml | consul-kv
  route-resolver: yaml

  # Load balancer strategy: round-robin | random | least-connections | weighted
  load-balancer: round-robin

  forwarding:
    connect-timeout: PT5S
    read-timeout: PT30S
    write-timeout: PT10S
    max-connections: 500
    max-idle-time: PT30S
    max-in-memory-size-bytes: 4194304   # 4 MB

  cache:
    route-ttl: PT5M
    discovery-ttl: PT30S
    max-size: 1000

  # Route definitions (used when route-resolver=yaml)
  #
  # Format:
  #   {soapOperation}:
  #     service:     <Consul service name registered by Nomad>
  #     targetPath:  <upstream HTTP path on the service>
  #     timeout:     <ISO-8601 duration, optional, default PT30S>
  #
  # The gateway discovers service instances dynamically from Consul on every cache miss.
  # Ports are NEVER hardcoded here — they come from Consul at runtime.
  routes:
    createCustomer:
      service: customer-service
      targetPath: /soap/customer
      timeout: PT30S
    updateCustomer:
      service: customer-service
      targetPath: /soap/customer
    getCustomer:
      service: customer-service
      targetPath: /soap/customer
    createOrder:
      service: order-service
      targetPath: /soap/order
    getOrder:
      service: order-service
      targetPath: /soap/order
    makePayment:
      service: payment-service
      targetPath: /soap/payment
    issuePolicy:
      service: policy-service
      targetPath: /soap/policy

# ── Consul HTTP API Client ──────────────────────────────────────────────────
consul:
  host: 127.0.0.1
  port: 8500
  scheme: http
  token: ""               # Consul ACL token (leave blank if ACL disabled)
  datacenter: dc1
  kv-route-prefix: gateway/routes
  connect-timeout: PT2S
  read-timeout: PT5S
